          properties:
            street1:
              type: string
              description: The primary address line of the recipient.
              example: "81 Bay Street"
            street2:
              type: string
              description: Additional address details such as floor or apartment.
              example: ""
            city:
              type: string
              description: City of the recipient's address.
              example: "Toronto"
            state:
              type: string
              description: |
                State or region of the recipient's address. Mandatory for Canada, United States, Spain; optional for other countries.
              example: "ON"
            zip:
              type: string
              description: ZIP or postal code of the recipient's address. Mandatory for Canada, United States, Spain; optional for other countries.
              example: "M5J0E7"
            country:
              type: string
              description: Country code (ISO 2-letter) of the recipient's address.
              example: "Canada"
            name:
              type: string
              description: Name of the recipient.
              example: "Bob Smith"
            phone:
              type: string
              description: Phone number of the recipient.
              example: "555-987-6543"
            email:
              type: string
              description: Email address of the recipient.
              example: "bob@example.com"
        parcel:
          type: object
          description: Parcel details. This is optional, but highly recommended. If not provided, will use dimensions provided during onboarding.
          properties:
            length:
              type: number
              description: Length of the parcel. Length unit to be set up during onboarding (cm/ in)
              example: 10.5
            width:
              type: number
              description: Width of the parcel. Width unit to be set up during onboarding (cm/ in)
              example: 5.2
            height:
              type: number
              description: Height of the parcel. Height unit to be set up during onboarding (cm/ in)
              example: 1.1
            weight:
              type: number
              description: Weight of the parcel. Weight unit to be set up during onboarding (oz / lb / kg / g)
              example: 10.15
        items:
          type: array
          description: Array of items to be shipped.
          items:
            type: object
            required: [ quantity, value, weight ]
            properties:
              description:
                type: string
                description: Description of the item.
                example: "Black T-Shirt"
              hs_code:
                type: string
                description: Harmonized System (HS) code for customs declaration.
                example: "9505900000"
              sku:
                type: string
                description: Stock Keeping Unit (SKU) identifier for the item.
                example: "TSHIRT123"
              quantity:
                type: number
                description: Number of units of the item.
                example: 2
              value:
                type: number
                description: Total value of the item. This is the post-discounted value in store currency.
                example: 24.68
              weight:
                type: number
                description: Total weight of the item. Weight unit to be set up during onboarding (oz / lb / kg / g)
                example: 1.0
              origin:
                type: string
                description: Origin country of item.
                example: "US"

    Cart_Response:
      type: object
      required: [ request_id, currency, rates ]
      properties:
        request_id:
          type: string
          description: Unique identifier for tracking the API request.
          example: "682302a7-6c05-438f-ae8e-9b8cffc054b2"
        currency:
          type: string
          description: The currency in which all returned prices are converted.
          example: "EUR"
        rates:
          type: array
          description: List of available shipping rates.
          items:
            type: object
            required: [ service_name, service_code, rate, tax, duty, total, edd ]
            properties:
              service_name:
                type: string
                description: The name of the shipping service offered.
                example: "Passport Priority Duties and Taxes Paid"
              service_code:
                type: string
                description: The service code of the shipping service.
                example: "PriorityDdpDelcon"
              rate:
                type: number
                description: Shipping cost before additional charges.
                example: 9
              tax:
                type: number
                description: Tax amount applied to the shipping cost.
                example: 0
              duty:
                type: number
                description: Customs duty applied to the shipping cost.
                example: 6
              insurance:
                type: number
                description: Cost of insurance for the shipment.
                example: 1
              formatted:
                type: object
                description: Default formatted (e.g. currency symbol, placement etc) string values for amounts. Format can be customized by contacting Passport.
                properties:
                  rate:
                    type: string
                    example: "€9"
                  tax:
                    type: string
                    example: "€0"
                  duty:
                    type: string
                    example: "€6"
                  insurance:
                    type: string
                    example: "€1"
              description:
                type: string
                description: Description of service level
                example: "The total amount is inclusive of all local duties, taxes and fees. We guarantee no additional charges on delivery."
              total:
                type: number
                description: Total shipping, tax, duty, and insurance amounts.
                example: 16
              edd:
                type: object
                required: [ min_days, max_days ]
                properties:
                  min_days:
                    type: number
                    description: Minimum estimated delivery time in days.
                    example: 7
                  max_days:
                    type: number
                    description: Maximum estimated delivery time in days.
                    example: 11
                  message:
                    type: string
                    description: A user-friendly delivery message.
                    example: "7-11 business days."
              duty_tax_breakdown:
                type: array
                description: Item level breakdown of duties and taxes calculated for each item.
                items:
                  type: object
                  properties:
                    sku:
                      type: string
                      description: SKU of the item.
                      example: "TSHIRT123"
                    description:
                      type: string
                      description: Description of the item.
                      example: "Black T-Shirt"
                    tax:
                      type: number
                      description: Tax amount for the item.
                      example: 0
                    duty:
                      type: number
                      description: Duty amount for the item.
                      example: 6

    ProductPrice_Request:
      type: object
      required: [ base_currency, presentment_currency, country, values ]
      properties:
        base_currency:
          type: string
          description: Currency code of currency to convert from (brand's store currency)
          example: USD
        presentment_currency:
          type: string
          description: Currency code of currency to convert to
          example: CAD
        country:
          type: string
          description: Country ISO2 code the presentment_currency belongs to
          example: CA
        values:
          type: array
          description: List of products with reference and value to convert
          items:
            type: object
            required:
              - reference
              - value
            properties:
              reference:
                type: string
                description: Reference field to link the request and response values
                example: Product_1_USD_CAD
              value:
                type: number
                description: Value to convert
                example: 1
          example:
            - reference: "Product_1_USD_CAD"
              value: 1
            - reference: "Product_2_USD_CAD"
              value: 2.35

    ProductPrice_Response:
      type: object
      required: [ base_currency, presentment_currency, currency_symbol, currency_code, currency_text, country, converted_values ]
      properties:
        base_currency:
          type: string
          description: Currency to convert from (brand's store currency)
          example: USD
        presentment_currency:
          type: string
          description: Currency to convert to
          example: CAD
        currency_symbol:
          type: string
          description: Currency symbol
          example: CAD
        currency_code:
          type: string
          description: Currency code
          example: CAD
        currency_text:
          type: string
          description: Currency name
          example: Canadian Dollar
        country:
          type: string
          description: Country ISO2 code that presentment_currency belongs to
          example: CA
        converted_values:
          type: array
          description: Converted values for all provided products
          items:
            type: object
            required: [reference, value, converted_value, conversion_rate, converted_value_with_fee, conversion_fee, converted_value_with_fee_rounded, converted_value_formatted]
            properties:
              reference:
                type: string
                description: Reference field to link the request and response values
                example: Product_1_USD_CAD
              value:
                type: number
                description: Original value to convert
                example: 1
              converted_value:
                type: string
                description: Converted value (before fee)
                example: "1.31234"
              adjustment:
                type: string
                description: Price adjustment applied to each product price
                example: "10%"
              adjusted_value:
                type: number
                description: Value after price adjustment
                example:  1.1
              conversion_rate:
                type: string
                description: Conversion rate used
                example: "1.31234"
              converted_value_with_fee:
                type: string
                description: Converted value with conversion fee
                example: "1.44357"
              conversion_fee:
                type: string
                description: Conversion fee amount added
                example: "0.1"
              converted_value_with_fee_rounded:
                type: string
                description: Converted value with conversion fee, rounded as per rules
                example: "1.44"
              converted_value_formatted:
                type: string
                description: Formatted converted value
                example: "1.44 CAD"
          example:
            - reference: "Product_1_USD_CAD"
              value: 1
              converted_value: "1.31234"
              conversion_rate: "1.31234"
              converted_value_with_fee: "1.44357"
              conversion_fee: "0.1"
              converted_value_with_fee_rounded: "1.44"
              converted_value_formatted: "1.44 CAD"
            - reference: "Product_2_USD_CAD"
              value: 2.35
              converted_value: "3.08400"
              conversion_rate: "1.31234"
              converted_value_with_fee: "3.39240"
              conversion_fee: "0.1"
              converted_value_with_fee_rounded: "3.39"
              converted_value_formatted: "3.39 CAD"

    TaxAndDuty_Request:
      type: object
      required: [ shipping_rate, address_from, address_to, items ]
      properties:
        reference:
          type: string
          description: Unique identifier for the request.
          example: "ORDER12345"
        presentment_currency:
          type: string
          description: The currency to which all amounts should be converted to. If not provided, will default to the store currency configured during onboarding.
          example: "EUR"
        shipping_rate:
          type: number
          description: Cost of shipping in store currency. If Free Shipping, can pass 0.
          minimum: 0
          example: 0
        insurance:
          type: number
          description: Insurance amount applicable in store currency.
          minimum: 0
          example: 0
        address_from:
          type: object
          required: [ country ]
          properties:
            street1:
              type: string
              description: The primary address line of the sender.
              example: "123 Main St"
            street2:
              type: string
              description: Additional address details such as floor or apartment.
              example: "Apt 4B"
            city:
              type: string
              description: City of the sender's address.
              example: "Los Angeles"
            state:
              type: string
              description: State or region of the sender's address.
              example: "CA"
            zip:
              type: string
              description: ZIP or postal code of the sender's address.
              example: "90045"
            country:
              type: string
              description: Country name of the sender's address. Use 2-letter ISO country code.
              example: "US"
              externalDocs:
                url: http://www.worlddata.info/countrycodes.php
        address_to:
          type: object
          required: [ country ]
          properties:
            street1:
              type: string
              description: The primary address line of the recipient.
              example: "81 Bay Street"
            street2:
              type: string
              description: Additional address details such as floor or apartment.
              example: ""
            city:
              type: string
              description: City of the recipient's address.
              example: "Toronto"
            state:
              type: string
              description: |
                State or region of the recipient's address.
                Mandatory for CA, US, Spain. Optional for ROW.
              example: "ON"
            zip:
              type: string
              description: |
                ZIP or postal code of the recipient's address.
                Mandatory for CA, US, Spain. Optional for ROW.
              example: "M5J0E7"
            country:
              type: string
              description: Country name of the recipient's address. Use 2-letter ISO country code.
              example: "CA"
              externalDocs:
                url: http://www.worlddata.info/countrycodes.php
        items:
          type: array
          description: Array of items to calculate tax and duty for.
          items:
            type: object
            required: [ quantity, value ]
            properties:
              description:
                type: string
                description: Description of the item in the package. Recommended for accurate D&T Calculations.
                example: "Black T-Shirt"
              hs_code:
                type: string
                description: |
                  Harmonized System (HS) code for customs declaration. Recommended for accurate D&T Calculations.
                  If not provided, will use the HS Code configured during onboarding.
                example: "9505900000"
              sku:
                type: string
                description: Stock Keeping Unit (SKU) identifier for the item. Recommended for accurate D&T Calculations.
                example: "TSHIRT123"
              quantity:
                type: number
                description: Number of units of the item.
                example: 2
              value:
                type: number
                description: Total value of the item (price per unit * quantity - discounts) in the store currency.
                minimum: 0
                exclusiveMinimum: true
                example: 24.68
              weight:
                type: number
                description: Total weight of the item (weight per unit * quantity). Will use the weight metric configured during onboarding.
                minimum: 0
                example: 1.0
              origin:
                type: string
                description: |
                  Origin country of item. If not provided, will use the origin configured during onboarding.
                  Use 2-letter ISO country code.
                example: "US"
                externalDocs:
                  url: http://www.worlddata.info/countrycodes.php

    TaxAndDuty_Response:
      type: object
      required: [ request_id, currency, rates ]
      properties:
        request_id:
          type: string
          description: Unique identifier for tracking the API request.
          example: "682302a7-6c05-438f-ae8e-9b8cffc054b2"
        currency:
          type: string
          description: The currency in which all returned prices are converted.
          example: "EUR"
        rates:
          type: array
          description: List of tax and duty rates.
          items:
            type: object
            required: [ tax, duty, total, formatted, duty_tax_breakdown ]
            properties:
              tax:
                type: number
                description: Tax amount applied to the shipping cost.
                example: 0
              duty:
                type: number
                description: Customs duty applied to the shipping cost.
                example: 6
              total:
                type: number
                description: Total shipping, tax, duty, & insurance amounts.
                example: 16
              formatted:
                type: object
                required: [ tax, duty ]
                description: Default formatted (e.g. currency symbol, placement etc) string values for amounts. Format can be customized by contacting Passport.
                properties:
                  tax:
                    type: string
                    description: Formatted tax value.
                    example: "€0"
                  duty:
                    type: string
                    description: Formatted duty value.
                    example: "€6"
              duty_tax_breakdown:
                type: array
                description: Item level breakdown of duties & taxes calculated for each item.
                items:
                  type: object
                  properties:
                    sku:
                      type: string
                      description: Item identifier.
                      example: "TSHIRT123"
                    description:
                      type: string
                      description: Item description.
                      example: "Black T-Shirt"
                    tax:
                      type: number
                      description: Tax for a particular item.
                      example: 0
                    duty:
                      type: number
                      description: Duty for a particular item.
                      example: 6
