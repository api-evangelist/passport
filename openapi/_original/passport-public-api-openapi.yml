---
openapi: 3.0.1

info:
  title: Getting Started with Passport Global API
  description: <h2>Introduction</h2><p>Passport Global's API is designed to allow for quick integration to begin selling and shipping internationally. It offers endpoints for general shipping-related functions, including rate requests and shipping label generation.</p><h2>Prerequisites</h2><p><ul><li>Passport Global API is a REST-like API. All methods must be called using HTTPS.</li><li>Authentication and identification is done by providing an API key on every request as a custom HTTP header "X-Access-Token".</li><li>All requests are made using the POST method.</li><li>The API key is provided by our onboarding team. For more details see registration and authentication.</li><li>The API uses JSON formatting for requests and responses.</li><li>Environments<ul><li>Testing Environment:<a href="https://api-stg.passportshipping.com/v3"> api-stg.passportshipping.com/v3</a></li><li>Production Environment:<a href="https://api.passportshipping.com/v3"> api.passportshipping.com/v3</a></li></ul></li></ul></p><h2>Registration and Authentication</h2><p>During the onboarding or integration process, our Onboarding team will create an account for your organization and provide the API key to your designated point of contact, which is typically a member of the operations, development team, or one of the founders.</p><h2>Making Your First Request</h2><p>A typical first request is to obtain a shipping rate. Use the <code>/rate</code> endpoint, providing necessary details like the addresses (<code>address_to</code> and <code>address_from</code>), parcel dimensions, and item descriptions.<br/><br/>Use the documentation below to see an example request body for a rate request</p><h2>Response Handling</h2><p>Successful responses return a 200 status code<br/><br/>Handle error responses (for example 401 Unauthorized, 404 Not Found) according to the provided error messages for each endpoint provided below.</p>
  version: '3.15'
  x-logo:
    url: 'PassportLogo.svg'
    background: '#FAFAFA'
    altText: 'Logo Passport added via API Definition'

servers:
  - url: https://api-stg.passportshipping.com/v3

tags:
  - name: Rate
  - name: Ship
  - name: Void
  - name: Order
  - name: Cart
  - name: Product Price
  - name: Tax And Duty
  - name: Healthcheck

paths:
  /rate:
    post:
      tags:
        - Rate
      summary: Request a shipping rate including landed cost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rate_Request'
        required: true
      responses:
        200:
          description: (OK) List of available rates for given shipment params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rate_Response'
        400:
          description: Bad Request (See details in the examples)
          content:
            application/json:
              examples:
                MixedCurrency:
                  value:
                    message: "Passport only accepts a single currency for items at a time. Currencies received: ['USD', 'AED', 'GBP']"
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/InvalidData'
        500:
          $ref: '#/components/responses/ServerError'

  /ship:
    post:
      tags:
        - Ship
      summary: Request a shipping label
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ship_Request'
        required: true
      responses:
        200:
          description: (OK) List of available rates for given shipment params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ship_Response'
        400:
          description: Bad Request (See details in the examples)
          content:
            application/json:
              examples:
                BadRequest:
                  value:
                    message: "Brand has not been onboarded within Passport’s system. Please reach out to Passport support."
                MixedCurrency:
                  value:
                    message: "Passport only accepts a single currency for items at a time. Currencies received: ['USD', 'AED', 'GBP']"
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/InvalidData'
        500:
          $ref: '#/components/responses/ServerError'
  /void/{code}:
    post:
      tags:
        - Void
      summary: Void an existing shipping label
      parameters:
        - in: path
          name: code
          schema:
            type: string
          required: true
          description: Uses the tracking code returned by /ship endpoint
      responses:
        200:
          description: (OK) label voided
        400:
          description: Bad Request, with an error message for non-voidable shipments
        404:
          description: Not Found, for invalid tracking codes
  /order:
    servers:
      - url: https://api-stg.passportshipping.com/custom/v1
    post:
      tags:
        - Order
      summary: Send order information
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order_POST_Request'
        required: true
      responses:
        200:
          description: OK
        400:
          description: Bad Request - Brand has not been onboarded within Passport’s system. Please reach out to Passport support.
          content:
            application/json:
              examples:
                IntegrationNotFound:
                  value:
                    details: "Brand has not been onboarded within Passport’s system. Please reach out to Passport support."
        401:
          description: Unauthorized - Unable to access the requested resource, authorization failed.
          content:
            application/json:
              examples:
                UnauthorizedAccess:
                  value:
                    message: "Unable to access the requested resource, authorization failed."
                    details: "missing/incorrect authorization data"
        403:
          description: Forbidden - Brand is blocked.
          content:
            application/json:
              examples:
                MerchantBlocked:
                  value:
                    message: "Brand is blocked"
                    details: "Brand is blocked"
        404:
          description: Not Found
          content:
            application/json:
              examples:
                NotFound:
                  value:
                    message: "Not Found"
                    code: 0
                    details: "Bad URL"
        422:
          description: Unprocessable Entity (See details in the examples)
          content:
            application/json:
              examples:
                EmptyBody:
                  value:
                    message: "Body cant be blank"
                    details: "Empty body"
                ValidationErrors:
                  value:
                    message: "Body validation errors"
                    details:
                      body:
                        currency_code:
                          - "Currency code cannot be blank"
                          - "Currency must be a string."
                          - "Currency code should contain 3 characters."
                        value:
                          - "Value must be a number."
                          - "Value cannot be blank"
                          - "Value must be no greater than 99999999.99."
                          - "Value must be no less than 0.01."
                        total_value:
                          - "Total value must be a number."
                          - "Total value cannot be blank"
                          - "Total value must be no greater than 99999999.99."
                          - "Total value must be no less than 0.01."
                        order_name:
                          - "Order name value cannot be blank"
                          - "Order name should contain at most 100 characters."
                        created:
                          - "Created name value cannot be blank"
                          - "Created must be an integer."
                      items:
                        name:
                          - "Name cannot be blank"
                        requires_shipping:
                          - "Requires shipping cannot be blank"
                        value:
                          - "Value must be a number."
                          - "Value cannot be blank"
                          - "Value must be no greater than 99999.99."
                          - "Value must be no less than 0.01."
                        value_discounted:
                          - "Value discounted must be a number."
                          - "Value discounted cannot be blank"
                          - "Value discounted must be no greater than 99999.99."
                          - "Value discounted must be no less than 0.01."
                        quantity:
                          - "Quantity cannot be blank"
                          - "Quantity discounted must be a number."
                        weight:
                          - "Weight cannot be blank"
                      address_to:
                        street1:
                          - "street1 cannot be blank"
                          - "street1 must be a string"
                        city:
                          - "city cannot be blank"
                          - "city must be a string"
                        country:
                          - "country cannot be blank"
                          - "country must be a string"
                        company:
                          - "Company must be a string"
                        street2:
                          - "Street2 must be a string"
                      shipping:
                        id:
                          - "Id must be a number."
                        rate:
                          - "Rate must be a number."
                          - "Rate cannot be blank"
                          - "Rate must be no greater than 99999.99."
                          - "Rate must be no less than 0.01."
                        duty:
                          - "Duty must be a number."
                          - "Duty cannot be blank"
                          - "Duty must be no greater than 99999.99."
                          - "Duty must be no less than 0.01."
                        tax:
                          - "Tax must be a number."
                          - "Tax cannot be blank"
                          - "Tax must be no greater than 99999.99."
                          - "Tax must be no less than 0.01."
                        service_name:
                          - "Service name must be a string."
                        duty_source:
                          - "Duty source name must be a string."
                        tax_source:
                          - "Tax source name must be a string."
        500:
          description: Internal Server Error
          content:
            application/json:
              examples:
                InternalError:
                  value:
                    message: "Sorry, something went wrong while processing your request. We are already working on a solution. RequestId: $RequestId"
                    details: "Internal Server Error"

    put:
      parameters:
        - name: orderNames
          in: query
          required: true
          description: Unique order identifier used to update an order. This is not case sensitive
          schema:
            type: string
          example: 'WEB-1001'
      tags:
        - Order
      summary: Update order information
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order_PUT_Request'
        required: true
      responses:
        200:
          description: Success, order data has been successfully updated and saved;
        401:
          description: 'Unauthorised: Returned when authentication fails'
          content:
            application/json:
              examples:
                UnauthorizedAccess:
                  value:
                    message: "Unauthorised: Returned when authentication fails"
        403:
          description: "Denied: Returned when orders are past 1 year"
          content:
            application/json:
              examples:
                MerchantBlocked:
                  value:
                    message: "Denied: Returned when orders are past 1 year"
        404:
          description: "Not found: order with ORDER_NAME not found"
          content:
            application/json:
              examples:
                NotFound:
                  value:
                    message: "Not found: order with ORDER_NAME not found"
        422:
          description: "Unprocessable Entity: Returned when the request payload is missing mandatory information or contains invalid data."
          content:
            application/json:
              examples:
                ValidationErrors:
                  value:
                    message: "Unprocessable Entity: Returned when the request payload is missing mandatory information or contains invalid data"

    delete:
      parameters:
        - name: orderNames
          in: query
          required: true
          description: Unique order identifier used to update an order. This is not case sensitive.
          schema:
            type: string
          example: 'WEB-1001,WEB-1002,WEB-1003'
      tags:
        - Order
      summary: Delete order
      responses:
        200:
          description: request successfully processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_DELETE_Response'
        400:
          description: "Bad Request: Returned when order name is not in correct format or brand is not onboarded within Passport’s systems."
          content:
            application/json:
              examples:
                BadRequest:
                  value:
                    message: "Returned when order name is not in correct format or brand is not onboarded within Passport’s systems."
        401:
          description: 'Unauthorised: Returned when authentication fails.'
          content:
            application/json:
              examples:
                UnauthorizedAccess:
                  value:
                    message: "Unauthorised: Returned when authentication fails."
        403:
          description: "Forbidden: Brand is blocked"
          content:
            application/json:
              examples:
                MerchantBlocked:
                  value:
                    message: "Forbidden: Brand is blocked"
        500:
          description: Internal Server Error
          content:
            application/json:
              examples:
                InternalError:
                  value:
                    message: "Internal Server Error"
    get:
      parameters:
        - name: orderNames
          in: query
          required: true
          description: Unique order identifier used to update an order. This is not case sensitive.
          schema:
            type: string
          example: 'WEB-1001,WEB-1002,WEB-1003'
      tags:
        - Order
      summary: Get orders
      responses:
        200:
          description: "Request successfully processed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_GET_Response'
        400:
          description: "Bad Request"
          content:
            application/json:
              examples:
                RequiredAndMustNonEmptyString:
                  value:
                    message: "Query parameter 'orderNames' is required and must be a non-empty string"
                MustContainLeastOneValue:
                  value:
                    message: "Query parameter 'orderNames' must contain at least one value"
                IntegrationNotConfigured:
                  value:
                    message: "Integration is not configured for this merchant"
                BrandNotOnboarded:
                  value:
                    message: "Brand has not been onboarded within Passport’s system. Please reach out to Passport support"
        401:
          description: 'Unauthorised: Missing or invalid credentials'
          content:
            application/json:
              examples:
                UnauthorizedAccess:
                  value:
                    message: "Unauthorised: Missing or invalid credentials"
        403:
          description: "Forbidden: Brand is blocked"
          content:
            application/json:
              examples:
                MerchantBlocked:
                  value:
                    message: "Forbidden: Brand is blocked"
        404:
          description: "Not Found: Orders were not found"
          content:
            application/json:
              examples:
                NotFound:
                  value:
                    message: "Not found: Orders were not found"
        500:
          description: "Internal Server Error: Generic failure while processing the request. The response contains a message with a `RequestId` you can share with support"
          content:
            application/json:
              examples:
                InternalError:
                  value:
                    message: "Internal Server Error: Generic failure while processing the request. The response contains a message with a `RequestId` you can share with support"
  /cart:
    servers:
      - url: https://api-stg.passportshipping.com/custom/v1
    post:
      tags:
        - Cart
      summary: Request rates for shipping, duties, and taxes for an order
      description: |
        Brands can send information to this endpoint to receive rates (shipping, duties & taxes) for an order.
        Rates can be configured by contacting Passport for each country & service level:
        - Shipping: Live, flat, free, free with threshold
        - Duties: Live, free
        - Taxes: Live, free

        Rates can also be received in the desired local currency.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart_Request'
        required: true
      responses:
        200:
          description: (OK) Rates calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart_Response'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: Forbidden - Merchant is blocked
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Request payload is missing mandatory data or contains invalid data
        500:
          $ref: '#/components/responses/ServerError'
  /product-price:
    servers:
      - url: https://api-stg.passportshipping.com/custom/v1
    post:
      tags:
        - Product Price
      summary: Get converted product prices in selected currency
      description: |
        E-commerce brands can use the product price endpoint to request product prices in the currency of their choosing. API details:
        - Exchange rates are updated 1/day to ensure product price stability through the day. Brands can also choose to configure static exchange rates of their choosing.
        - Product prices are rounded to 0 decimal places by default, but can be customized on a per currency basis.
        - Product prices use a default display format, but can be customized on a per currency basis.
      operationId: getProductPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPrice_Request'
      responses:
        '200':
          description: Successful response with converted product prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPrice_Response'
        '400':
          description: Bad Request - Currency not supported or other validation errors
          content:
            application/json:
              examples:
                PresentmentCurrencyNotSupported:
                  value:
                    message: "presentment_currency EUR is not supported."
                    details: "Currency is not supported"
                BaseCurrencyNotSupported:
                  value:
                    message: "base_currency XYZ is not supported."
                    details: "Currency is not supported"
        '401':
          description: Unauthorized - Unable to access the requested resource, authorization failed
          content:
            application/json:
              examples:
                UnauthorizedAccess:
                  value:
                    message: "Unable to access the requested resource, authorization failed."
                    details: "missing/incorrect authorization data"
        '403':
          description: Forbidden - Merchant is blocked
          content:
            application/json:
              examples:
                MerchantBlocked:
                  value:
                    message: "Merchant is blocked"
                    details: "Merchant is blocked"
        '404':
          description: Not Found - Bad URL
          content:
            application/json:
              examples:
                NotFound:
                  value:
                    message: "Not Found"
                    code: 0
                    details: "Bad URL"
        '422':
          description: Unprocessable Entity - Body validation errors
          content:
            application/json:
              examples:
                ValidationErrors:
                  value:
                    message: "Body validation errors"
                    details:
                      body:
                        base_currency:
                          - "Base currency cannot be blank."
                        presentment_currency:
                          - "Presentment currency cannot be blank."
                        values:
                          - "Values cannot be blank."
                        reference:
                          - "Reference cannot be blank."
                        value:
                          - "Value cannot be blank."
                          - "Value must be no less than 0.01."
                          - "Value must be no greater than 9999999.99."
                          - "Value must be a number."
        '500':
          description: Internal Server Error - Other errors or unprocessed exceptions
          content:
            application/json:
              examples:
                InternalError:
                  value:
                    message: "Sorry, something went wrong while processing your request. We are already working on a solution. RequestId: $RequestId"
                    details: "Other errors or unprocessed exceptions."

  /tax-and-duty:
    servers:
      - url: https://api-stg.passportshipping.com/custom/v1
    post:
      tags:
        - Tax And Duty
      summary: Calculate tax and duty for an order
      description: |
        Brands can send information to this endpoint to receive landed costs (duties & taxes), in their desired currency for an order.
        
        This API supports all landed cost calculations for any physical products from any country to any country, with a few exceptions:
        - Domestic tax calculations (except for Canada, Australia)
        - US inbound taxes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxAndDuty_Request'
        required: true
      responses:
        200:
          description: (OK) Tax and duty calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxAndDuty_Response'
        400:
          description: Bad Request - Brand has not been onboarded within Passport's system. Please reach out to Passport support.
          content:
            application/json:
              examples:
                BrandNotOnboarded:
                  value:
                    message: "Brand has not been onboarded within Passport's system. Please reach out to Passport support."
        401:
          description: Unauthorized - Unable to access the requested resource, authorization failed.
          content:
            application/json:
              examples:
                UnauthorizedAccess:
                  value:
                    message: "Unable to access the requested resource, authorization failed."
                    details: "missing/incorrect authorization data"
        403:
          description: Forbidden - Brand is blocked.
          content:
            application/json:
              examples:
                MerchantBlocked:
                  value:
                    message: "Brand is blocked"
                    details: "Brand is blocked"
        404:
          description: Not Found
          content:
            application/json:
              examples:
                NotFound:
                  value:
                    message: "Not Found"
                    code: 0
                    details: "Bad URL"
        422:
          description: Unprocessable Entity - Returned when the request payload is missing mandatory data or contains invalid data.
          content:
            application/json:
              examples:
                ValidationErrors:
                  value:
                    message: "Request payload is missing mandatory data or contains invalid data"
        500:
          description: Internal Server Error
          content:
            application/json:
              examples:
                InternalError:
                  value:
                    message: "Sorry, something went wrong while processing your request. We are already working on a solution. RequestId: $RequestId"
                    details: "Internal Server Error"

  /ping:
    get:
      tags:
        - Healthcheck
      summary: Healtcheck
      description: Check if the API Server is up and running
      responses:
        200:
          description: (OK), API Server is Up and running

components:
  responses:
    BadRequest:
      description: Brand has not been onboarded within Passport’s system. Please reach out to Passport support.
    Unauthorized:
      description: (Unauthorized) Unable to access the requested resource, you don't have authorization, please check your API Key
    NotFound:
      description: Sender's company not found in the list of authorized values, please, contact us if the company name is correct
    InvalidData:
      description: If data validation fails, an error description with HTTP status = 422 is returned.
    ServerError:
      description: Internal Server Error.

  schemas:
    Rate_Request:
      type: object
      required: [address_to, address_from, parcel, items]
      properties:
        reference:
          type: string
          description: The ID you are using for identifying the order for which you are requesting the rate, optional but strongly encouraged
          example: shipmentref
        address_to:
          type: object
          required: [street1, country]
          properties:
            reference:
              type: string
              example: To address 1
            street1:
              type: string
              description: Must contain a street number.
              maxLength: 40
              example: 111 Broadway Ave.
            street2:
              type: string
              maxLength: 40
              example: Floor 7
            city:
              type: string
              maxLength: 32
              example: London
            state:
              type: string
              maxLength: 100
              example: ""
              description: Required for most destination countries. Optional but strongly encouraged to ensure smooth delivery.
            zip:
              type: string
              example: B33 8TH
            country:
              type: string
              example: GB
              description: Use 2-letter ISO country code
              externalDocs:
                url: http://www.worlddata.info/countrycodes.php
            name:
              type: string
              maxLength: 100
              example: John Smith
            company:
              type: string
              maxLength: 100
              example: Company Inc
            phone:
              type: string
              maxLength: 100
              example: 518-111-1111
              description: Optional but strongly encouraged to ensure smooth delivery.
            email:
              type: string
              maxLength: 100
              example: js-myth@example.com
              description: Optional but strongly encouraged to ensure smooth delivery.
        address_from:
          type: object
          required: [street1, country, company]
          properties:
            reference:
              type: string
              maxLength: 100
              example: From address 1
            street1:
              type: string
              maxLength: 40
              example: 111 sunset blvd.
            street2:
              type: string
              maxLength: 40
              example:
            city:
              type: string
              maxLength: 32
              example: Los angeles
            state:
              type: string
              maxLength: 100
              example: CA
              description: Required for most destination countries. Optional but strongly encouraged to ensure smooth delivery.
            zip:
              type: string
              example: "90111"
            country:
              type: string
              example: US
              description: Use 2-letter ISO country code
              externalDocs:
                url: http://www.worlddata.info/countrycodes.php
            name:
              type: string
              maxLength: 100
              example: Allison Fox
            company:
              type: string
              maxLength: 100
              example: Lululemon
            phone:
              type: string
              maxLength: 100
              example: 518-111-1111
              description: Optional but strongly encouraged to ensure smooth delivery.
            email:
              type: string
              maxLength: 100
              example: js-myth@example.com
              description: Optional but strongly encouraged to ensure smooth delivery.
        parcel:
          type: object
          required: [length, width, height]
          properties:
            reference:
              type: string
              example: Parcel ID
            length:
              type: number
              example: 10.5
            units_length:
              type: string
              enum: ['in', 'ft', 'mm', 'cm', 'm']
              default: 'in'
              example: in
            width:
              type: number
              description: 'Units: “in”.'
              example: 5.2
            height:
              type: number
              description: 'Units: “in”.'
              example: 1.1
            weight:
              type: number
              minimum: 0
              exclusiveMinimum: true
              example: 100.15
              description: Total weight of the parcel including all items and packaging
            units_weight:
              type: string
              enum: ['oz', 'lb', 'mcg', 'mg', 'g', 'kg']
              default: 'oz'
              example: oz
        items:
          type: array
          items:
            type: object
            required: [description, quantity, value, weight]
            properties:
              description:
                type: string
                maxLength: 255
                example: Black T-shirt
              hs_code:
                type: string
                example: "3304300000"
                minLength: 6
                maxLength: 12
                description: Required for most destination countries. Optional but strongly encouraged to ensure smooth delivery.
              sku:
                type: string
                maxLength: 100
                example: GEN12345
                description: Required for most destination countries
              quantity:
                type: number
                example: 2
              value:
                type: number
                example: 12.34
                minimum: 0
                exclusiveMinimum: true
                description: Value is equivalent to total value of the items = (single item value) x quantity. In this example unit price is $6.17, $6.17 x 2 = $12.34. In other words, if you ship three T-shirts worth $10 each, quantity = 3, value = 30.
              weight:
                type: number
                example: 0.5
                minimum: 0
                exclusiveMinimum: true
                description: 'Units: “oz”. <br> Weight is equivalent to total weight of the items = (single item weight) x quantity. In this example unit weight is 0.25 oz, 0.25 x 2 = 0.5. In other words, if you ship three T-shirts 3 oz each, you should put quantity = 3 and weight = 9.'
