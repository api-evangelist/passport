summary: >-
  Passport publishes no dated API changelog. Two partial substitutes exist: a product-release page that narrates
  platform updates by product area without per-entry dates, and the Redoc version selector on the API docs, which
  keeps the two prior OpenAPI documents fetchable. The API entries below are DERIVED by diffing those three
  documents — additive-only across 3.13 → 3.15, with no operation or schema removed.
