gaps:
- No dates on any release — neither the product-release page nor the OpenAPI documents carry a release date.
- No machine-readable changelog feed (RSS/Atom/JSON) for the API.
- The product-release page describes APIs (geolocation, currency conversion, price inclusivity) that do not appear in the public OpenAPI, so part of the API surface is undocumented publicly.
