service_alerts:
  url: https://passportglobal.com/service-alerts/
  http_status: 200
  note: >-
    Carrier/lane-level operational advisories (strikes, customs changes, peak-season cutoffs) for shippers —
    the operational sibling of the status page, not an API incident feed.
health_check:
