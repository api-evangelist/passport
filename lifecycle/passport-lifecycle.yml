summary: >-
  Passport versions its public API by URL major (/v3) with a minor document version (3.15 current) and keeps the
  two previous documents publicly retrievable. It runs a real status page and a customer-facing service-alerts
  page. It publishes no deprecation policy, no sunset schedule, no support window, and no SLA on its public
  developer surface.
versioning:
  strategy: uri-path-major + document-minor
  current_version: '3.15'
  url_major: v3
  base_url: https://api.passportshipping.com/v3
  published_versions:
  - version: '3.15'
    label: latest
    url: https://docs.passportglobal.com/passport_public_api_v3_15.yml
    http_status: 200
    operations: 11
  - version: '3.14'
    url: https://docs.passportglobal.com/passport_public_api_v3_14.yml
    http_status: 200
    operations: 10
  - version: '3.13'
    url: https://docs.passportglobal.com/passport_public_api_v3_13.yml
    http_status: 200
    operations: 4
  note: >-
    Older documents remain fetchable but carry no "supported until" statement, so it is not knowable from the
    public surface whether 3.13 and 3.14 are still served by the runtime.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
