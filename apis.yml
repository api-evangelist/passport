aid: passport
name: Passport
description: >-
  Passport (Passport Global, Inc.) is a cross-border ecommerce logistics and compliance platform founded in 2017
  that helps direct-to-consumer brands sell and ship internationally to 190+ markets. The company combines its own
  international parcel network (Passport Shipping) with in-country enablement, marketplace management, trade and
  fiscal compliance, seller/merchant-of-record services, duty drawback, and returns. Its public REST API — the
  Passport Global API, currently version 3.15 — exposes landed-cost rating, shipping label generation and voiding,
  order submission and management, cart-level duty and tax quoting, currency-converted product pricing, and a
  tax-and-duty calculator, authenticated with an X-Access-Token API key issued by the Passport onboarding team.
