apis:
- name: Passport Global API
  description: >-
    REST-like JSON API for international shipping and landed cost. Endpoints cover shipping rate requests including
    duties and taxes (/rate), shipping label generation (/ship) and voiding (/void/{code}), order create/update/
    delete/read (/order), cart-level rate, duty and tax quoting (/cart), currency-converted product pricing
    (/product-price), a standalone tax and duty calculator (/tax-and-duty), and a health check (/ping). All calls
    are HTTPS and authenticated with an X-Access-Token header API key provisioned during onboarding.
  humanURL: https://docs.passportglobal.com/
  baseURL: https://api.passportshipping.com/v3
